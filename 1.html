<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="pract/styl.css">

    <style>

        /* убираем стрелки */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type="number"] {
        -moz-appearance: textfield;
    }
    #filterYear {
        padding-right: 45px !important;
    }
    </style>

  <title>Система управления книжным каталогом</title>

</head>
<body>
  <div class="container">
    <header>
      <span class="icon">📖</span>
      СИСТЕМА УПРАВЛЕНИЯ КНИЖНЫМ КАТАЛОГОМ
      <span class="icon">📖</span>
    </header>

      <!-- Статистика -->
    <div class="stats" id="statsContainer"></div>

    <!-- фильтры -->
    <div class="filters">
  <div class="filter-group">
    <label>🔍 По названию</label>
    <input type="text" id="filterTitle" placeholder="Название книги">
  </div>
  <div class="filter-group">
    <label>👤 По автору</label>
    <input type="text" id="filterAuthor" placeholder="Фио">
  </div>
  <div class="filter-group">
    <label>📚 По жанру</label>
    <select id="filterGenre">
      <option value="all">Все жанры</option>
      <option value="Роман">Роман</option>
      <option value="Повесть">Повесть</option>
      <option value="Рассказы">Рассказы</option>
      <option value="Драматургия">Драматургия</option>
      <option value="Поэзия">Поэзия</option>
      <option value="Сказки">Сказки</option>
    </select>
  </div>
  <div class="filter-group">
    <label>📅 По году издания</label>
    <div class="year-input-wrapper">
      <input type="number" id="filterYear" placeholder="Год издания">
      <span class="calendar-icon" onclick="showYearList()">📅</span>
    </div>
  </div>

  <!-- кнопка сбросить -->
  <button onclick="resetFilters()" class="add-book-btn" style="margin-left: 0;">
  🔄 Сбросить
  </button>
        <!-- кнопка добавить книгу -->
  <button class="add-book-btn" onclick="showAddModal()">
    ➕ Добавить книгу
  </button>
    </div>
    <!-- Таблица книг -->
    <div class="main-content">
      <div class="table-container">
        <div class="table-wrapper">
          <table id="bookTable">
            <thead>
              <tr>
                <th>Название</th>
                <th>Инициалы</th>
                <th>Год</th>
                <th>Жанр</th>
                <th>Копии</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  <!-- редактирование книги -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Редактирование книги</div>
        <div class="paperclip">🧷</div>
      </div>
      <div class="form-field">
        <label>Название книги</label>
        <input type="text" id="editModalTitle" placeholder="напишите название книги">
      </div>
      <div class="form-field">
        <label>Автор</label>
        <input type="text" id="editModalAuthor" placeholder="напишите автора">
      </div>
      <div class="form-field">
        <label>Год издания</label>
        <input type="number" id="editModalYear" placeholder="напишите год его издания">
      </div>
      <div class="form-field">
        <label>Жанр</label>
        <input type="text" id="editModalGenre" placeholder="напишите жанр">
      </div>
      <div class="form-field">
        <label>Кол-во экземпляров</label>
        <input type="number" id="editModalCopies" value="1" placeholder="напишите кол-во экземпляров">
      </div>
      <div class="form-field">
        <label>Описание</label>
        <textarea id="editModalDescription" placeholder="краткое описание..."></textarea>
      </div>
      <div class="modal-buttons">
        <button class="btn-add" onclick="saveEditedBook()">
          ✅ Сохранить
        </button>
        <button class="btn-cancel" onclick="closeEditModal()">
          ❌ Отменить
        </button>
      </div>
    </div>
  </div>
    <div class="version-bar">
      <button onclick="showDevModal()" style="padding:8px 18px; font-size: 0.95rem; border:none; border-radius:8px; cursor:pointer;">
        📱 Перейти в мобильную версию
      </button>
    </div>
  </div>


  <!-- Окно в разработке -->
  <div class="dev-modal" id="devModal">
    <div class="dev-modal-content">
      <h2>🚧 Мобильная версия</h2>
      <p style="font-size: 1.1rem; margin-bottom: 25px;">В настоящее время находится в разработке.<br>Скоро будет доступна!</p>
      <button onclick="closeDevModal()" style="padding:12px 30px; background:#9c3e2b; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer;">
        Понятно
      </button>
    </div>
  </div>
  <!--  окно списка годов -->
  <div class="year-list-modal" id="yearListModal">
    <div class="year-list-content">
      <h3 style="margin-bottom:15px; color:#9c3e2b;">Выберите год</h3>
      <div id="yearList"></div>
      <button onclick="closeYearListModal()" style="margin-top:15px; padding:10px 20px; background:#c44a4a; color:white; border:none; border-radius:8px; cursor:pointer;">
        Закрыть
      </button>
    </div>
  </div>

  <!-- окно добавления книги -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Добавление книги</div>
        <div class="paperclip">🧷</div>
      </div>
      <div class="form-field">
        <label>Название книги</label>
        <input type="text" id="modalTitle" placeholder="напишите название книги">
      </div>
      <div class="form-field">
        <label>Автор</label>
        <input type="text" id="modalAuthor" placeholder="напишите автора">
      </div>
      <div class="form-field">
        <label>Год издания</label>
        <input type="number" id="modalYear" placeholder="напишите год его издания">
      </div>
      <div class="form-field">
        <label>Жанр</label>
        <input type="text" id="modalGenre" placeholder="напишите жанр">
      </div>
      <div class="form-field">
        <label>Кол-во экземпляров</label>
        <input type="number" id="modalCopies" value="1" placeholder="напишите кол-во экземпляров">
      </div>
      <div class="form-field">
        <label>Описание</label>
        <textarea id="modalDescription" placeholder="краткое описание..."></textarea>
      </div>
      <div class="modal-buttons">
        <button class="btn-add" onclick="addBookFromModal()">
          ✅ Добавить
        </button>
        <button class="btn-cancel" onclick="closeModal()">
          ❌ Отменить
        </button>
      </div>
    </div>
  </div>

<!-- Основные функции -->

  <script>
          // Обновление статистики после всех изменений (верхняя часть)
    function updateStats() {
      const totalBooks = books.length;
      const totalCopies = books.reduce((sum, book) => sum + (book.copies || 0), 0);
      const uniqueGenres = new Set(books.map(book => book.genre)).size;
      const uniqueAuthors = new Set(books.map(book => book.author)).size;

      document.getElementById('statsContainer').innerHTML = `
        <div class="stat-card">
          <div class="stat-number">${totalBooks}</div>
          <div class="stat-label">Всего книг</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${totalCopies}</div>
          <div class="stat-label">Экземпляров</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${uniqueGenres}</div>
          <div class="stat-label">Жанров</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${uniqueAuthors}</div>
          <div class="stat-label">Авторов</div>
        </div>
      `;
    }
    <!-- Модалка -->
    function showAddModal() {
      document.getElementById('addModal').style.display = 'flex';
      //очистка полей
      document.getElementById('modalTitle').value = '';
      document.getElementById('modalAuthor').value = '';
      document.getElementById('modalYear').value = '';
      document.getElementById('modalGenre').value = '';
      document.getElementById('modalCopies').value = '1';
      document.getElementById('modalDescription').value = '';
    }

    function closeModal() {
      document.getElementById('addModal').style.display = 'none';
    }

    // Пустые функции-заглушки (чтобы не было ошибок в консоли)
    function resetFilters() {}
    function showYearList() {}
    function showDevModal() {}
    function addBookFromModal() {
      alert("Книга успешно добавлена! (демо)");
      closeModal();
    }
  </script>
</body>
  <script>
    let books = [
      { id: 1, title: "Война и мир", author: "Толстой Л.Н.", year: 1869, genre: "Роман", copies: 2, description: "Эпический роман о войне и любви" },
      { id: 2, title: "Преступление и наказание", author: "Достоевский Ф.М.", year: 1866, genre: "Роман", copies: 1, description: "Психологический роман" },
      { id: 3, title: "Мастер и Маргарита", author: "Булгаков М.А.", year: 1967, genre: "Роман", copies: 4, description: "Сатирический роман с элементами фантастики" },
      { id: 4, title: "Детство", author: "Толстой Л.Н.", year: 1852, genre: "Повесть", copies: 7, description: "Автобиографическая повесть" }
    ];
    let nextId = 5;

    function updateStats() {
      const total = books.length;
      const copies = books.reduce((sum, b) => sum + b.copies, 0);
      const genres = new Set(books.map(b => b.genre)).size;
      const authors = new Set(books.map(b => b.author)).size;
      document.getElementById('statsContainer').innerHTML = `
        <div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">Всего книг</div></div>
        <div class="stat-card"><div class="stat-number">${copies}</div><div class="stat-label">экземпляры</div></div>
        <div class="stat-card"><div class="stat-number">${genres}</div><div class="stat-label">жанры</div></div>
        <div class="stat-card"><div class="stat-number">${authors}</div><div class="stat-label">кол-во авторов</div></div>
      `;
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const titleFilter = document.getElementById('filterTitle').value.toLowerCase().trim();
      const authorFilter = document.getElementById('filterAuthor').value.toLowerCase().trim();
      const genreFilter = document.getElementById('filterGenre').value;
      const yearFilter = document.getElementById('filterYear').value;

      let filtered = books.filter(book => {
        const matchTitle = titleFilter === '' || book.title.toLowerCase().startsWith(titleFilter);

        // Поиск по первым буквам фамилии
        let matchAuthor = true;
        if (authorFilter) {
          const surname = book.author.split(' ')[0].toLowerCase();
          matchAuthor = surname.startsWith(authorFilter);
        }

        const matchGenre = genreFilter === 'all' || book.genre === genreFilter;
        const matchYear = !yearFilter || book.year == yearFilter;

        return matchTitle && matchAuthor && matchGenre && matchYear;
      });

      tbody.innerHTML = filtered.map(book => `
        <tr>
          <td>${book.title}</td>
          <td>${book.author}</td>
          <td>${book.year}</td>
          <td>${book.genre}</td>
          <td>${book.copies}</td>
          <td>
            <button class="action-btn edit-btn" onclick="editBook(${book.id})">✏️</button>
            <button class="action-btn delete-btn" onclick="deleteBook(${book.id})">🗑</button>
          </td>
        </tr>
      `).join('');
    }

    function showYearList() {
      const years = [...new Set(books.map(b => b.year))].sort((a, b) => b - a);
      const container = document.getElementById('yearList');
      container.innerHTML = years.map(year => `
        <div class="year-item" onclick="selectYear(${year})">${year}</div>
      `).join('');
      document.getElementById('yearListModal').style.display = 'flex';
    }

    function selectYear(year) {
      document.getElementById('filterYear').value = year;
      closeYearListModal();
      renderTable();
    }

    function closeYearListModal() {
      document.getElementById('yearListModal').style.display = 'none';
    }

    function showAddModal() {
      document.getElementById('addModal').style.display = 'flex';
      document.getElementById('modalTitle').value = '';
      document.getElementById('modalAuthor').value = '';
      document.getElementById('modalYear').value = '';
      document.getElementById('modalGenre').value = '';
      document.getElementById('modalCopies').value = '1';
      document.getElementById('modalDescription').value = '';
    }

    function closeModal() {
      document.getElementById('addModal').style.display = 'none';
    }

    function addBookFromModal() {
      const title = document.getElementById('modalTitle').value.trim();
      const author = document.getElementById('modalAuthor').value.trim();
      const year = parseInt(document.getElementById('modalYear').value);
      const genre = document.getElementById('modalGenre').value.trim();
      const copies = parseInt(document.getElementById('modalCopies').value) || 1;
      const description = document.getElementById('modalDescription').value.trim();

      if (!title || !author || !year || !genre) {
        alert("Заполните обязательные поля!");
        return;
      }

      books.push({ id: nextId++, title, author, year, genre, copies, description });
      alert("Книга успешно добавлена!");
      closeModal();
      updateStats();
      renderTable();
    }
   //функции для редактирования
    let editingId = null;

    function editBook(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;

      editingId = id;
      document.getElementById('editModalTitle').value = book.title;
      document.getElementById('editModalAuthor').value = book.author;
      document.getElementById('editModalYear').value = book.year;
      document.getElementById('editModalGenre').value = book.genre;
      document.getElementById('editModalCopies').value = book.copies;
      document.getElementById('editModalDescription').value = book.description || '';

      document.getElementById('editModal').style.display = 'flex';
    }

    function saveEditedBook() {
      if (!editingId) return;

      const book = books.find(b => b.id === editingId);
      if (book) {
        book.title = document.getElementById('editModalTitle').value.trim();
        book.author = document.getElementById('editModalAuthor').value.trim();
        book.year = parseInt(document.getElementById('editModalYear').value);
        book.genre = document.getElementById('editModalGenre').value.trim();
        book.copies = parseInt(document.getElementById('editModalCopies').value) || 1;
        book.description = document.getElementById('editModalDescription').value.trim();
      }

      alert("Книга успешно обновлена!");
      closeEditModal();
      updateStats();
      renderTable();
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
      editingId = null;
    }

    function deleteBook(id) {
      if (confirm("Удалить книгу?")) {
        books = books.filter(b => b.id !== id);
        updateStats();
        renderTable();
      }
    }
        // фильтры
    function resetFilters() {
      document.getElementById('filterTitle').value = '';
      document.getElementById('filterAuthor').value = '';
      document.getElementById('filterGenre').value = 'all';
      document.getElementById('filterYear').value = '';
      renderTable();
    }

    function showDevModal() {
      document.getElementById('devModal').style.display = 'flex';
    }

    function closeDevModal() {
      document.getElementById('devModal').style.display = 'none';
    }

    // Инициализация
    updateStats();
    renderTable();

    // Живые фильтры
    document.getElementById('filterTitle').addEventListener('input', renderTable);
    document.getElementById('filterAuthor').addEventListener('input', renderTable);
    document.getElementById('filterGenre').addEventListener('change', renderTable);
    document.getElementById('filterYear').addEventListener('input', renderTable);
  </script>
</body>
</html>
